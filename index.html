<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1522">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Спина">
<title>Спина — тренировки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0E1522;--rail:#121B2B;--surface:#172235;--surface2:#213049;--line:#24324A;
  --text:#EAF0FA;--muted:#8FA0BA;--accent:#5FB0FF;--on:#0B1628;--accentText:#9ECDFF;
  --tint:#13284A;--partial:#2D5A8C;--empty:#1E2A3E;--danger:#FF9C9C;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:flex;min-height:100dvh}
.rail{width:72px;flex-shrink:0;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 28px) 0 24px;position:sticky;top:0;height:100dvh}
.rail button{width:60px;padding:10px 0;border:0;border-radius:16px;background:none;color:var(--muted);display:flex;
  flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500}
.rail button.on{background:var(--tint);color:var(--accentText);font-weight:600}
.main{flex:1;min-width:0;max-width:560px;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 20px);
  display:flex;flex-direction:column;gap:22px}
.muted{color:var(--muted)}
.small{font-size:13px}
h1{margin:0;font-size:28px;font-weight:700}
.big{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:24px;background:var(--accent);
  color:var(--on);font-weight:800}
.ghost{background:none;border:0;color:var(--muted);font-size:15px;font-weight:500;padding:12px 4px}
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pill{background:var(--tint);color:var(--accentText);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:500}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,minmax(0,1fr));grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;aspect-ratio:12/7.4}
.grid div{border-radius:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.step{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface2);font-size:22px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);
  background:none;text-align:left;width:100%}
.ex-row .meta{font-size:14px;color:var(--muted);white-space:nowrap}
.textin{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;height:52px;font-size:17px}
textarea.textin{height:auto;padding:12px 16px;resize:vertical;font-size:15px}
.blockname{background:none;border:0;border-bottom:1px dashed transparent;font-size:18px;font-weight:700;padding:4px 0;min-width:0;width:100%}
.blockname:focus{border-bottom-color:var(--muted);outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.seg button{height:44px;border:0;border-radius:10px;background:none;font-weight:600}
.seg button.on{background:var(--accent);color:var(--on)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:16px;cursor:pointer}
.switch input{appearance:none;width:52px;height:32px;border-radius:16px;background:var(--surface2);position:relative;flex-shrink:0;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:var(--text);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:23px;background:var(--on)}
.label{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.danger{color:var(--danger)}
/* workout */
.wo{min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.wo-top{padding:calc(env(safe-area-inset-top) + 16px) 24px 0;display:flex;flex-direction:column;gap:12px}
.bar{height:4px;border-radius:2px;background:var(--empty)}
.bar div{height:4px;border-radius:2px;background:var(--accent);transition:width .2s}
.wo-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 24px;gap:14px}
.side{align-self:flex-start;background:var(--surface2);color:var(--accentText);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:600}
.wo-name{margin:0;font-size:32px;font-weight:700;line-height:1.15}
.count{font-size:96px;font-weight:800;line-height:1;letter-spacing:-3px}
.wo-btn{min-height:38vh;margin:0 12px calc(env(safe-area-inset-bottom) + 12px);border-radius:32px;font-size:40px}
.wo-btn.sec{background:var(--surface);color:var(--text);border:2px solid var(--surface2)}
.ring{position:relative;width:min(240px,60vw);aspect-ratio:1;align-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,18,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--surface2);color:var(--text);
  padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;max-width:90vw}
.pain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pain button{height:60px;border-radius:14px;border:0;background:var(--surface);font-size:22px;font-weight:700}
.pain button.on{background:var(--accent);color:var(--on)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 64px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.spacer{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY = 'spina-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
const DAYS = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_LONG = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dkey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const addDays = (d, n) => { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() + n); return x; };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const mmss = s => Math.floor(s / 60) + ':' + String(Math.max(0, Math.ceil(s) % 60)).padStart(2, '0');

const I = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  chart: '<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',
  flame: '<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/>',
  check: '<circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
};
const svg = (p, size = 24, extra = '') => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;

function defaultData() {
  const ex = (name, type, target, perSide = false) => ({ id: uid(), name, type, target, perSide, note: '' });
  return {
    v: 1,
    program: { blocks: [
      { id: uid(), name: 'Блок A', rounds: 5, exercises: [
        ex('Ягодичный мост на одну ногу', 'reps', 15, true),
        ex('Тяга носочков вперёд-назад', 'reps', 20),
        ex('Разминка спины на ролике', 'time', 45),
      ]},
      { id: uid(), name: 'Блок B', rounds: 5, exercises: [
        ex('Упражнение 1', 'reps', 10), ex('Упражнение 2', 'reps', 10), ex('Упражнение 3', 'reps', 10),
      ]},
    ]},
    sessions: [],
    active: null,
  };
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.program && Array.isArray(d.program.blocks)) { d.sessions = d.sessions || []; return d; } } catch (e) {}
  return defaultData();
}
let data = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

let ui = { screen: data.active ? 'workout' : 'home', blockId: null, exId: null, confirmEnd: false, confirmDel: null, lastSessionId: null, toast: '' };
let toastTimer = null;
function toast(msg) { ui.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { ui.toast = ''; render(); }, 2600); }

// ---------- program helpers ----------
const blocks = () => data.program.blocks;
function stepsOf(b) {
  const out = [];
  if (!b) return out;
  for (let r = 1; r <= b.rounds; r++) for (const e of b.exercises) for (const side of (e.perSide ? ['Левая сторона', 'Правая сторона'] : [null])) out.push({ r, e, side });
  return out;
}
const nonEmpty = () => blocks().map((b, i) => i).filter(i => blocks()[i].exercises.length > 0);
function estMinutes() {
  let s = 0;
  for (const b of blocks()) for (const st of stepsOf(b)) s += (st.e.type === 'time' ? st.e.target : st.e.target * 3) + 10;
  return Math.max(1, Math.round(s / 60));
}
const exMeta = e => (e.type === 'time' ? `${e.target} сек` : `${e.target} повт.`) + (e.perSide ? ' × 2 стороны' : '');
const findEx = () => { const b = blocks().find(b => b.id === ui.blockId); const e = b && b.exercises.find(e => e.id === ui.exId); return { b, e }; };

// ---------- discipline ----------
function dayMap() {
  const m = {};
  for (const s of data.sessions) { if (s.blocksDone < 1) continue; const v = s.blocksDone >= s.blocksTotal ? 2 : 1; m[s.date] = Math.max(m[s.date] || 0, v); }
  return m;
}
function streakInfo() {
  const m = dayMap();
  const today = dkey(Date.now());
  let d = m[today] ? new Date() : addDays(new Date(), -1), cur = 0;
  while (m[dkey(d)]) { cur++; d = addDays(d, -1); }
  const keys = Object.keys(m).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) { run = prev && dkey(addDays(fromKey(prev), 1)) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return { cur, best: Math.max(best, cur), doneToday: !!m[today], m };
}

// ---------- sound / wake lock ----------
let actx = null, wake = null;
function initAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() {
  try {
    initAudio(); if (!actx) return;
    [0, 0.22, 0.44].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const s = actx.currentTime + t; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.35, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
      o.start(s); o.stop(s + 0.2);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}
async function requestWake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if (data.active && document.visibilityState === 'visible') requestWake(); });

// ---------- workout flow ----------
function startWorkout() {
  const ne = nonEmpty();
  if (!ne.length) { toast('Добавь хотя бы одно упражнение в программу'); return; }
  initAudio();
  data.active = { blockIdx: ne[0], stepIdx: 0, startedAt: Date.now(), blocksDone: 0, phase: 'step', nextBlock: null, timer: null };
  save(); ui.screen = 'workout'; requestWake(); render();
}
function curStep() { const a = data.active; return stepsOf(blocks()[a.blockIdx])[a.stepIdx]; }
function advance() {
  const a = data.active; if (!a) return;
  a.timer = null; a.stepIdx++;
  if (a.stepIdx >= stepsOf(blocks()[a.blockIdx]).length) {
    a.blocksDone++;
    const next = nonEmpty().find(i => i > a.blockIdx);
    if (next === undefined) { finishWorkout(); return; }
    a.phase = 'between'; a.nextBlock = next;
  }
  save(); render();
}
function goBack() { const a = data.active; if (a && a.stepIdx > 0) { a.stepIdx--; a.timer = null; save(); render(); } }
function finishWorkout() {
  const a = data.active;
  const s = { id: uid(), date: dkey(Date.now()), start: a.startedAt, end: Date.now(), blocksDone: a.blocksDone, blocksTotal: nonEmpty().length, pain: null };
  data.active = null; releaseWake(); stopTick();
  if (s.blocksDone > 0) { data.sessions.push(s); ui.lastSessionId = s.id; ui.screen = 'finish'; }
  else ui.screen = 'home';
  ui.confirmEnd = false; save(); render();
}
function timerTap() {
  const a = data.active, st = curStep(), now = Date.now();
  initAudio();
  if (!a.timer) a.timer = { state: 'run', endsAt: now + st.e.target * 1000, left: st.e.target * 1000 };
  else if (a.timer.state === 'run') { a.timer.left = Math.max(0, a.timer.endsAt - now); a.timer.state = 'pause'; }
  else { a.timer.endsAt = now + a.timer.left; a.timer.state = 'run'; }
  save(); render();
}
let tickH = null;
function stopTick() { clearInterval(tickH); tickH = null; }
function ensureTick() {
  const a = data.active;
  if (!(a && a.phase === 'step' && a.timer && a.timer.state === 'run')) { stopTick(); return; }
  if (tickH) return;
  tickH = setInterval(() => {
    const a = data.active;
    if (!(a && a.timer && a.timer.state === 'run')) { stopTick(); return; }
    const left = (a.timer.endsAt - Date.now()) / 1000;
    if (left <= 0) { stopTick(); beep(); advance(); return; }
    const st = curStep(), el = document.getElementById('tleft'), arc = document.getElementById('tarc');
    if (el) el.textContent = mmss(left);
    if (arc) arc.setAttribute('stroke-dashoffset', String(678.6 * (1 - left / st.e.target)));
  }, 200);
}

// ---------- views ----------
function rail(active) {
  const it = (id, label, icon) => `<button class="${active === id ? 'on' : ''}" data-a="nav" data-to="${id}" ${active === id ? 'aria-current="page"' : ''}>${svg(icon)}${label}</button>`;
  return `<nav class="rail" aria-label="Меню">${it('home', 'Главная', I.home)}${it('program', 'Программа', I.list)}${it('history', 'История', I.chart)}</nav>`;
}
function vHome() {
  const now = new Date();
  const { cur, best, doneToday, m } = streakInfo();
  const wd = (now.getDay() + 6) % 7;
  const start = addDays(now, -wd - 77);
  const todayK = dkey(now);
  let cells = '';
  for (let i = 0; i < 84; i++) {
    const d = addDays(start, i), k = dkey(d);
    let bg = 'var(--empty)', extra = '';
    if (k > todayK) bg = 'transparent';
    else if (m[k] === 2) bg = 'var(--accent)';
    else if (m[k] === 1) bg = 'var(--partial)';
    if (k === todayK && !m[k]) { bg = 'var(--surface)'; extra = 'box-shadow:inset 0 0 0 2px var(--accent)'; }
    cells += `<div style="background:${bg};${extra}" title="${d.getDate()} ${MONTHS[d.getMonth()]}"></div>`;
  }
  let last30 = 0; for (let i = 0; i < 30; i++) if (m[dkey(addDays(now, -i))]) last30++;
  const nb = nonEmpty().length, nex = blocks().reduce((s, b) => s + b.exercises.length, 0);
  const a = data.active;
  const hint = doneToday ? `<div class="pill">Сегодня сделано. Так держать</div>`
    : cur > 0 ? `<div class="pill">Сделай сегодня, чтобы не прервать серию</div>`
    : `<div class="pill">Начни серию сегодня — хватит одного блока</div>`;
  return `<div class="shell">${rail('home')}<main class="main">
    <div class="muted" style="font-size:15px">${DAYS_LONG[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]}</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:flex-end;gap:8px">
        <span style="color:var(--accent);margin-bottom:8px">${svg(I.flame, 34)}</span>
        <span style="font-size:68px;font-weight:800;line-height:1;letter-spacing:-2px">${cur}</span>
        <span style="font-size:18px;font-weight:600;padding-bottom:8px">${plural(cur, ['день', 'дня', 'дней'])} подряд</span>
      </div>
      <div class="muted" style="font-size:14px">Рекорд: ${best} ${plural(best, ['день', 'дня', 'дней'])}</div>
    </div>
    ${hint}
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="small muted">Последние 12 недель · за 30 дней: ${last30}</div>
      <div class="grid" role="img" aria-label="Календарь тренировок за 12 недель">${cells}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Полная</span><span><i style="background:var(--partial)"></i>Частичная</span><span><i style="background:var(--empty)"></i>Пропуск</span></div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:17px;font-weight:600">Спина</div>
      <div class="muted" style="font-size:14px">${nb} ${plural(nb, ['блок', 'блока', 'блоков'])} · ${nex} ${plural(nex, ['упражнение', 'упражнения', 'упражнений'])} · ~${estMinutes()} мин</div>
    </div>
    ${a ? `<button class="big" style="height:96px;font-size:26px" data-a="resume">Продолжить</button>
           <button class="ghost" style="align-self:center" data-a="askEnd">Завершить незаконченную</button>`
        : `<button class="big" style="height:96px;font-size:26px" data-a="start">Начать</button>`}
  </main></div>${sheet()}`;
}
function vWorkout() {
  const a = data.active, bl = blocks(), ne = nonEmpty();
  if (a.phase === 'step') {
    const len = stepsOf(bl[a.blockIdx]).length;
    if (!len) {
      const next = ne.find(i => i > a.blockIdx);
      if (next === undefined) { setTimeout(finishWorkout, 0); return ''; }
      a.phase = 'between'; a.nextBlock = next;
    } else if (a.stepIdx >= len) a.stepIdx = len - 1;
  }
  if (a.phase === 'between' && !bl[a.nextBlock]) { const next = ne.find(i => i > a.blockIdx); if (next === undefined) { setTimeout(finishWorkout, 0); return ''; } a.nextBlock = next; }
  const allSteps = ne.reduce((s, i) => s + stepsOf(bl[i]).length, 0) || 1;
  let doneSteps = 0; for (const i of ne) { if (i < a.blockIdx) doneSteps += stepsOf(bl[i]).length; }
  if (a.phase === 'step') doneSteps += a.stepIdx; else doneSteps = ne.filter(i => i <= a.blockIdx).reduce((s, i) => s + stepsOf(bl[i]).length, 0);

function vHistory() {

    return `<div class="hrow"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600">${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</span>

// ---------- actions ----------
const actions = {

  nextBlock: () => { const a = data.active; a.blockIdx = a.nextBlock; a.stepIdx = 0; a.phase = 'step'; a.nextBlock = null; save(); },
  askEnd: () => { ui.confirmEnd = true; },

  delBlock: d => {

  exType: d => { const { e } = findEx(); if (e.type !== d.t) { e.type = d.t; e.target = d.t === 'time' ? 30 : 10; save(); } },

  delEx: () => {

    b.exercises = b.exercises.filter(x => x.id !== e.id); ui.confirmDel = null; ui.screen = 'program'; save();
  },
  export: () => {
    const blob = new Blob([JSON.stringify({ ...data, active: null }, null, 2)], { type: 'application/json' });

document.addEventListener('click', ev => {

  if (t.dataset.a !== 'delBlock' && t.dataset.a !== 'delEx' && ui.confirmDel && !['rounds'].includes(t.dataset.a)) ui.confirmDel = null;

      data = d; save(); ui.screen = 'home'; toast('Данные загружены');
    } catch (e) { toast('Не получилось прочитать файл'); }
    ev.target.value = '';
  };
  r.readAsText(file);
});

if (data.active) requestWake();
render();
// re-render home at midnight / on return so the date and streak stay right
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ui.screen !== 'exercise') render(); });
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
</html>
